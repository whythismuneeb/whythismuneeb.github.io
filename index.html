<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Menu</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #1a1a1a; color: white; text-align: center; font-family: Arial; }
    .btn { display: inline-block; margin: 25px 10px; background: #ff6b00; color: white; padding: 16px 32px; border-radius: 12px; font-size: 20px; text-decoration: none; }
    model-viewer { width: 100%; height: 45vh; }
  </style>
</head>
<body>
  <h1>🔥 Special Dish</h1>

  <a class="btn" id="arBtn"
     href="intent://arvr.google.com/scene-viewer/1.0?file=https://whythismuneeb.github.io/dish.glb&amp;mode=ar_only#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;end;">
     📱 AR Mein Kholo
  </a>

  <model-viewer src="dish.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls auto-rotate></model-viewer>

  <script>
    var isAndroid = /android/i.test(navigator.userAgent);
    if (isAndroid) {
      setTimeout(function() {
        window.location.href = document.getElementById('arBtn').href;
      }, 800);
    }
  </script>
</body>
</html>

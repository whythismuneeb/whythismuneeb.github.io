<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Menu</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #1a1a1a; text-align: center; font-family: Arial; color: white; }
    h1 { margin-top: 20px; }
    model-viewer { width: 100%; height: 75vh; }
  </style>
</head>
<body>
  <h1>🔥 Special Dish</h1>
  <model-viewer src="dish.glb"
                ar
                ar-modes="scene-viewer webxr quick-look"
                camera-controls
                auto-rotate
                shadow-intensity="1">
  </model-viewer>
  <p>Camera icon dabao AR ke liye 📱</p>
</body>
</html>
